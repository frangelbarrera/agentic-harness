[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arnes"
version = "0.1.0a3"
description = "Agentic Harness — The Open Agent Harness. Write the manual, it compiles it into a team of specialists."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Frangel Barrera", email = "frangelbarrera@users.noreply.github.com" },
]
keywords = [
    "ai-agents",
    "agent-framework",
    "agent-harness",
    "llm-agents",
    "llm",
    "python",
    "mcp",
    "model-context-protocol",
    "multi-agent",
    "react-agent",
    "a2a",
    "human-in-the-loop",
    "stateless-reducer",
    "agentic-harness",
    "agent-runtime",
    "agentic-ai",
    "self-hosted",
    "token-optimization",
    "anti-hallucination",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "structlog>=24.4,<27",
    "rich>=13.7,<15",
    "click>=8.1,<9",
    "litellm>=1.82.0,<1.97",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3,<1"]
anthropic = ["anthropic>=0.40,<2"]
openai = ["openai>=1.50,<4"]
mcp = ["aiohttp>=3.9,<4"]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<7",
    "pytest-mock>=3.14,<4",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "vcrpy>=6.0,<9",
    "freezegun>=1.5,<2",
    "types-PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/frangelbarrera/agentic-harness"
Documentation = "https://github.com/frangelbarrera/agentic-harness#readme"
Repository = "https://github.com/frangelbarrera/agentic-harness"
Issues = "https://github.com/frangelbarrera/agentic-harness/issues"
Changelog = "https://github.com/frangelbarrera/agentic-harness/blob/main/CHANGELOG.md"

[project.scripts]
agentic-harness = "arnes.cli.main:cli"
arnes = "arnes.cli.main:cli"  # backwards-compat alias

[tool.hatch.build.targets.wheel]
packages = ["arnes"]

[tool.hatch.build.targets.sdist]
include = ["arnes", "README.md", "LICENSE", "pyproject.toml"]

# ============================================================
# RUFF
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "tests/snapshot/cassettes"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "PL",       # pylint
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "S101",     # use of assert (needed for tests)
    "S603",     # subprocess call (we use it for sandboxed shell tool)
    "S607",     # partial path subprocess (sandboxed)
    "ANN401",   # dynamically typed expressions (Any) — needed for flexible APIs
    "PLC0415",  # import outside top-level — intentional for lazy loading in tools
    "PLR0913",  # too many arguments (we accept up to 8)
    "PLR0912",  # too many branches
    "PLR0911",  # too many return statements
    "PLR0917",  # too many positional arguments
    "PLR2004",  # magic value in comparison — would require constants for test values
    "SIM102",   # use if/elif — sometimes nested if is clearer
    "SIM117",   # nested with statements
    "PLR0915",  # too many statements — review loop is cohesive
    "B007",     # unused loop variable — false positive in some cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "PLR2004", "PLR0915", "RUF003", "RUF046", "RUF059"]
"examples/**" = ["ANN", "T201"]
"arnes/cli/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================
# MYPY
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ============================================================
# PYTEST
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
timeout = 300
log_cli = false
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=arnes",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=65",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "snapshot: marks tests using vcrpy cassettes",
]
filterwarnings = [
    # We do not promote third-party deprecation/resource warnings to errors:
    # they are noisy and vary across OS / Python / dependency versions, which
    # makes CI flaky on macOS and Windows for reasons unrelated to Agentic Harness itself.
    # Real bugs surface via ruff, mypy --strict, bandit and explicit assertions.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    # litellm emits a number of pydantic v1-style warnings on some platforms.
    "ignore::pydantic.PydanticDeprecatedSince20",
]

# ============================================================
# COVERAGE
# ============================================================
[tool.coverage.run]
source = ["arnes"]
branch = true
parallel = true
omit = [
    "arnes/__init__.py",
    "arnes/cli/__init__.py",
    "arnes/mcp/__init__.py",
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if t.TYPE_CHECKING:",
    "@overload",
]

# ============================================================
# BANDIT
# ============================================================
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv"]
skips = ["B101"]  # assert_used in tests

# ============================================================
# HATCH BUILD HOOKS
# ============================================================
[tool.hatch.build.hooks.mypyc]
enable-by-default = false

# ============================================================
# ============================================================

