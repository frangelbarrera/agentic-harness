name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # id-token: write is required for PyPI Trusted Publishing (OIDC).
  # This lets GitHub Actions publish to PyPI without storing a long-lived
  # API token in repo secrets. Configure the trusted publisher at:
  # https://pypi.org/manage/project/arnes/settings/publishing/
  id-token: write

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.19"

      - name: Install build tools
        run: uv sync --all-extras --dev --locked

      - name: Build package
        run: uv build

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish to PyPI
        # Uses PyPI Trusted Publishing (OIDC) — no API token needed.
        # The publisher is configured in PyPI to trust this repo +
        # workflow + environment.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cyclonedx.json
