name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # id-token: write is required for PyPI Trusted Publishing (OIDC).
  # This lets GitHub Actions publish to PyPI without storing a long-lived
  # API token in repo secrets. Configure the trusted publisher at:
  # https://pypi.org/manage/project/arnes/settings/publishing/
  id-token: write

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"

      - name: Install build tools
        run: uv sync --all-extras --dev --locked

      - name: Build package
        run: uv build

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish to PyPI
        # Uses PyPI Trusted Publishing (OIDC) — no API token needed.
        # The publisher is configured in PyPI to trust this repo +
        # workflow + environment.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cyclonedx.json
